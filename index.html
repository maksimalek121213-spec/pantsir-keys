<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantsir Hub | Secure Access</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap');

        body {
            background-color: #0a0a0c;
            background-image: 
                radial-gradient(at 10% 10%, rgba(168, 85, 247, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(30, 58, 138, 0.2) 0px, transparent 50%);
            color: #e0e0e0;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .main-box {
            background: rgba(20, 20, 25, 0.6);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(168, 85, 247, 0.2);
            text-align: center;
            width: 360px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            
            /* Анимация появления */
            opacity: 0;
            transform: translateY(30px);
            animation: slideIn 0.6s ease-out forwards;
        }

        @keyframes slideIn {
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            font-weight: 700;
            font-size: 28px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #a855f7, #ffffff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        p {
            font-weight: 300;
            color: #a0a0b0;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .key-input-container {
            position: relative;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(10, 10, 12, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #fff;
            border-radius: 12px;
            box-sizing: border-box;
            text-align: center;
            font-family: 'Poppins', monospace;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: rgba(168, 85, 247, 0.5);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.2);
        }

        button {
            width: 100%;
            padding: 16px 20px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-size: 15px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            
            /* Градиент кнопки */
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            color: white;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.5);
        }

        button:active {
            transform: translateY(1px);
        }

        /* Эффект волны при клике */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0);
            animation: ripple 0.6s linear;
            pointer-events: none;
        }

        @keyframes ripple {
            to { transform: scale(4); opacity: 0; }
        }

        /* Уведомление */
        .notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(20, 20, 25, 0.9);
            backdrop-filter: blur(10px);
            color: #fff;
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid rgba(40, 255, 100, 0.3);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            transform: translateX(150px);
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification svg {
            fill: #28ff64;
            width: 20px;
            height: 20px;
        }

    </style>
</head>
<body>

    <div class="main-box">
        <h2>Pantsir Hub</h2>
        <p>Нажми кнопку, чтобы получить ключ доступа</p>
        
        <button onclick="generateAndCopyKey(this)">
            Получить и скопировать ключ
        </button>
        
        <div class="key-input-container" style="margin-top: 20px;">
            <input type="text" id="keyField" readonly placeholder="Твой ключ появится здесь...">
        </div>
    </div>

    <div class="notification" id="notif">
        <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        <span>Ключ скопирован в буфер обмена!</span>
    </div>

    <script>
        function generateAndCopyKey(button) {
            // 1. Генерация ключа
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let key = "PANTSIR-";
            for (let i = 0; i < 16; i++) {
                key += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            
            const keyField = document.getElementById('keyField');
            keyField.value = key;

            // 2. Копирование в буфер
            navigator.clipboard.writeText(key).then(() => {
                // 3. Эффект волны (ripple)
                createRipple(event, button);
                
                // 4. Показ уведомления
                showNotification();
            }).catch(err => {
                console.error('Ошибка копирования: ', err);
                alert('Не удалось скопировать автоматически. Скопируйте вручную из поля ниже.');
            });
        }

        function createRipple(event, button) {
            const ripple = document.createElement('span');
            const diameter = Math.max(button.clientWidth, button.clientHeight);
            const radius = diameter / 2;
            
            ripple.style.width = ripple.style.height = `${diameter}px`;
            ripple.style.left = `${event.clientX - button.offsetLeft - radius}px`;
            ripple.style.top = `${event.clientY - button.offsetTop - radius}px`;
            ripple.classList.add('ripple');
            
            const rippleContainer = button.getElementsByClassName('ripple')[0];
            if (rippleContainer) {
                rippleContainer.remove();
            }
            
            button.appendChild(ripple);
        }

        function showNotification() {
            const notif = document.getElementById('notif');
            notif.classList.add('show');
            
            // Скрыть через 3 секунды
            setTimeout(() => {
                notif.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
