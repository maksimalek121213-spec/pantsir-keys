<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantsir Hub | Secure Access</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600;700&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            background-color: #070709;
            background-image: 
                radial-gradient(at 15% 15%, rgba(168, 85, 247, 0.12) 0px, transparent 50%),
                radial-gradient(at 85% 85%, rgba(59, 130, 246, 0.12) 0px, transparent 50%);
            color: #e0e0e0;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .main-box {
            background: rgba(16, 16, 22, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 45px 35px;
            border-radius: 28px;
            border: 1px solid rgba(168, 85, 247, 0.15);
            text-align: center;
            width: 390px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(168, 85, 247, 0.05);
            opacity: 0;
            transform: translateY(20px);
            animation: slideIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideIn {
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            font-weight: 700;
            font-size: 30px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #c084fc, #ffffff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        p {
            font-weight: 300;
            color: #94a3b8;
            margin-bottom: 35px;
            font-size: 13.5px;
            line-height: 1.5;
        }

        .key-input-container {
            position: relative;
            margin-top: 20px;
        }

        input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(10, 10, 14, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #c084fc;
            border-radius: 14px;
            box-sizing: border-box;
            text-align: center;
            font-family: 'Poppins', monospace;
            font-size: 13px;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: rgba(168, 85, 247, 0.6);
            background: rgba(10, 10, 14, 0.8);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.15);
        }

        button {
            width: 100%;
            padding: 16px 20px;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14.5px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            color: white;
            box-shadow: 0 8px 25px rgba(168, 85, 247, 0.35);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(168, 85, 247, 0.55);
            background: linear-gradient(135deg, #b066f8, #894df2);
        }

        button:active {
            transform: translateY(1px);
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
            transform: scale(0);
            animation: ripple 0.6s linear;
            pointer-events: none;
        }

        @keyframes ripple {
            to { transform: scale(4); opacity: 0; }
        }

        .notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(18, 18, 24, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            color: #fff;
            padding: 16px 22px;
            border-radius: 14px;
            border: 1px solid rgba(40, 255, 100, 0.25);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13.5px;
            font-weight: 500;
            z-index: 9999;
            transform: translateY(100px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        .notification.show {
            transform: translateY(0);
            opacity: 1;
            visibility: visible;
        }

        .notification svg {
            fill: #22c55e;
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <div class="main-box">
        <h2>Pantsir Hub</h2>
        <p>Click the button below to generate and get your access key</p>
        
        <button onclick="generateAndCopyKey(event, this)">
            Get & Copy Key
        </button>
        
        <div class="key-input-container">
            <input type="text" id="keyField" readonly placeholder="Your key will appear here...">
        </div>
    </div>

    <div class="notification" id="notif">
        <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        <span>Key copied to clipboard successfully!</span>
    </div>

    <script>
        function generateAndCopyKey(event, button) {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            
            let randomPart = "";
            for (let i = 0; i < 15; i++) {
                randomPart += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            
            let checksum = 0;
            for (let i = 0; i < randomPart.length; i++) {
                checksum += randomPart.charCodeAt(i);
            }
            let checkCode = (checksum % 89 + 10).toString();
            
            let key = "PANTSIR-" + randomPart + "-" + checkCode;
            
            const keyField = document.getElementById('keyField');
            keyField.value = key;

            navigator.clipboard.writeText(key).then(() => {
                createRipple(event, button);
                showNotification();
            }).catch(err => {
                console.error('Copy error: ', err);
                alert('Failed to copy automatically.');
            });
        }

        function createRipple(event, button) {
            const ripple = document.createElement('span');
            const diameter = Math.max(button.clientWidth, button.clientHeight);
            const radius = diameter / 2;
            
            ripple.style.width = ripple.style.height = `${diameter}px`;
            ripple.style.left = `${event.clientX - button.getBoundingClientRect().left - radius}px`;
            ripple.style.top = `${event.clientY - button.getBoundingClientRect().top - radius}px`;
            ripple.classList.add('ripple');
            
            const existingRipple = button.getElementsByClassName('ripple')[0];
            if (existingRipple) {
                existingRipple.remove();
            }
            
            button.appendChild(ripple);
        }

        function showNotification() {
            const notif = document.getElementById('notif');
            notif.classList.add('show');
            setTimeout(() => {
                notif.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
